{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "smtp-auth-proxy.fullname" . }}
  labels: {{- include "smtp-auth-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "smtp-auth-proxy.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  # Ingress is limited to the two service ports. Egress is left open on
  # purpose: the proxy has to reach login.microsoftonline.com and
  # smtp.office365.com, whose addresses are not enumerable in a policy.
  ingress:
    - ports:
        - port: smtp
          protocol: TCP
        - port: http
          protocol: TCP
{{- end }}
