apiVersion: v1
kind: Service
metadata:
  name: {{ include "smtp-auth-proxy.fullname" . }}-smtp
  labels: {{- include "smtp-auth-proxy.labels" . | nindent 4 }}
  {{- with .Values.smtp.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.smtp.service.type }}
  {{- if and (ne .Values.smtp.service.type "ClusterIP") .Values.smtp.service.externalTrafficPolicy }}
  # Local keeps the client's source address, which the per-account network
  # restrictions depend on; Cluster would SNAT every connection to a node IP.
  externalTrafficPolicy: {{ .Values.smtp.service.externalTrafficPolicy }}
  {{- end }}
  selector: {{- include "smtp-auth-proxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: smtp
      port: {{ .Values.smtp.service.port }}
      targetPort: smtp
      protocol: TCP
