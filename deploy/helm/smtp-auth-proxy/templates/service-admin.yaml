apiVersion: v1
kind: Service
metadata:
  name: {{ include "smtp-auth-proxy.fullname" . }}-admin
  labels: {{- include "smtp-auth-proxy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.admin.service.type }}
  selector: {{- include "smtp-auth-proxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.admin.service.port }}
      targetPort: http
      protocol: TCP
