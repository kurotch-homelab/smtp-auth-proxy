{{- if .Values.admin.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "smtp-auth-proxy.fullname" . }}
  labels: {{- include "smtp-auth-proxy.labels" . | nindent 4 }}
  {{- with .Values.admin.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.admin.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.admin.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.admin.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "smtp-auth-proxy.fullname" $ }}-admin
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
