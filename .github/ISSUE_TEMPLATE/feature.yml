name: Feature request
description: Suggest a capability the proxy does not have yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are stuck in, not the solution.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
