version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      # One PR for the routine bumps; majors stay separate so they get a review.
      go-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-dev-tooling:
        applies-to: version-updates
        patterns:
          - '@types/*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier*'
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - '@playwright/*'
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  # Every action is pinned to a commit SHA, so this is what keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /deploy/compose
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    labels: [dependencies, docker]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      docker-images:
        applies-to: version-updates
        update-types: [minor, patch]
