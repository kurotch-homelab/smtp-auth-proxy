name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A second push to the same PR makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '22'

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.11.0
          unformatted="$(gofumpt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofumpt found unformatted files:"
            echo "$unformatted"
            gofumpt -d cmd internal
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          args: --timeout=5m

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make tidy-check

  lint-actions:
    name: Lint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make lint-actions

  lint-web:
    name: Lint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run typecheck
        working-directory: web

  test-go:
    name: Test (Go, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: proxy
          POSTGRES_PASSWORD: proxy
          POSTGRES_DB: proxy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U proxy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # `make test` includes the end-to-end suite, which drives the wired proxy
      # the way a LAN device would — connect, STARTTLS, AUTH, send — against
      # stand-ins for Microsoft Entra and Exchange Online.
      - name: Test
        env:
          # Store tests run against Postgres only in that matrix leg; the SQLite
          # leg leaves the DSN empty and skips them.
          TEST_POSTGRES_DSN: ${{ matrix.db == 'postgres' && 'postgres://proxy:proxy@localhost:5432/proxy_test?sslmode=disable' || '' }}
        run: make test
      - name: Enforce coverage thresholds
        if: matrix.db == 'postgres'
        run: make coverage-check
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.db == 'postgres'
        with:
          files: coverage.out
          flags: go
          # Codecov is informational here; the hard gate is `make coverage-check`.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-web:
    name: Test (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run test:coverage
        working-directory: web

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Proves the real single-binary artifact builds: UI bundled, then embedded.
      - run: make web-build
      - run: make build
      - run: ./bin/smtp-auth-proxy version

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web

  license-check:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make license-check

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Boots the shipped Compose stack, creates an administrator the way the
      # README says to, signs in through the published port and checks the
      # SMTP banner — the exact first-run a new user performs.
      - name: Bring the stack up
        working-directory: deploy/compose
        run: |
          key="k1:$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')"
          export SMTP_AUTH_PROXY_ENCRYPTION_KEY="$key"
          docker compose up -d --build
          health=starting
          for _ in $(seq 1 90); do
            # The docker template braces are split so the workflow's own
            # templating does not try to interpret them.
            health=$(docker inspect --format '{''{.State.Health.Status}''}' compose-proxy-1 2>/dev/null || echo starting)
            [ "$health" = healthy ] && break
            sleep 2
          done
          docker compose ps
          [ "$health" = healthy ] || { docker compose logs proxy; exit 1; }
      - name: Create an administrator and sign in
        working-directory: deploy/compose
        run: |
          docker compose exec -T proxy /usr/local/bin/smtp-auth-proxy adduser             --config /etc/smtp-auth-proxy/config.yaml             --username admin --password 'a-ci-only-password'
          code=$(curl -s -o /tmp/login.json -w '%{http_code}'             -X POST http://localhost:8080/api/v1/auth/login             -H 'Content-Type: application/json'             -d '{"username":"admin","password":"a-ci-only-password"}')
          cat /tmp/login.json
          [ "$code" = "200" ]
      - name: Check the SMTP banner
        run: |
          response=$({ printf 'EHLO ci\r\nQUIT\r\n'; sleep 1; } | nc -w 5 localhost 587)
          echo "$response"
          echo "$response" | grep -q '220 .* ESMTP'
          echo "$response" | grep -q 'STARTTLS'
      - name: Logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs
