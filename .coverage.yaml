# Coverage thresholds enforced by `make coverage-check` (and the CI test-go job).
#
# `total` applies to every counted package combined. `packages` entries are
# matched against the package path relative to the module root, longest prefix
# wins, so a rule on `internal/store` also covers `internal/store/sqlc` unless
# that path has its own entry.
total: 75

packages:
  # Security- and correctness-critical: a regression here silently sends mail
  # from the wrong mailbox, leaks a secret, or loses a queued message.
  internal/policy: 90
  internal/queue: 90
  internal/crypto: 90
  internal/adminauth: 90

  # Thin wiring layers with little branching of their own.
  internal/version: 60
  internal/metrics: 0

exclude:
  # Generated by sqlc; covered indirectly through the store tests.
  - internal/store/sqlc
  # Build-time glue with no logic worth asserting on.
  - internal/tools
  - cmd/smtp-auth-proxy
  # Vendored Go sources inside npm packages.
  - web
